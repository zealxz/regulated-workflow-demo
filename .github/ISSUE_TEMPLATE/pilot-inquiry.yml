name: Fixed-scope pilot inquiry
description: Ask whether a document or data workflow fits the seven-day pilot.
title: "[Pilot inquiry] "
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not include confidential documents, credentials, personal data, internal URLs, or proprietary implementation details. A short, redacted description is enough for an initial fit check.

  - type: textarea
    id: bottleneck
    attributes:
      label: Current manual bottleneck
      description: Describe the repetitive document or data step and who reviews its result.
      placeholder: We compare two versions of public policy PDFs and manually prepare a change register for approval.
    validations:
      required: true

  - type: input
    id: volume
    attributes:
      label: Representative volume (optional)
      description: Give an approximate document count or row count using no sensitive details.
      placeholder: 12 PDFs, about 20 pages each

  - type: textarea
    id: acceptance
    attributes:
      label: Expected output and acceptance check
      description: What output is needed, and how would a human reviewer decide that it is useful?
      placeholder: Each change must show old value, new value, source page, and review status.
    validations:
      required: true

  - type: dropdown
    id: sample_boundary
    attributes:
      label: Sample-data boundary (optional)
      options:
        - Public data
        - Properly redacted data
        - Synthetic data
        - Not ready to share a sample
