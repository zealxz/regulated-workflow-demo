name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install workbook dependencies
        run: npm ci --ignore-scripts
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the PDF parser extra
        run: python -m pip install '.[pdf]'
      - name: Run unit tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Test workbook export
        run: npm run test:workbooks
      - name: Run offline demo
        run: python scripts/run_demo.py
      - name: Verify canonical and generated workbook outputs
        run: python scripts/verify_outputs.py outputs/extract outputs/diff
