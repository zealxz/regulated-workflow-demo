name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run offline demo
        run: python scripts/run_demo.py --skip-workbooks
      - name: Verify canonical outputs
        run: python scripts/verify_outputs.py outputs/extract outputs/diff --skip-workbooks
