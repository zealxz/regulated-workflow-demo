[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regulated-workflow-demo"
version = "0.1.0"
description = "Local-first, auditable document extraction and version-diff demo"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]

[project.scripts]
regulated-workflow = "regulated_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
